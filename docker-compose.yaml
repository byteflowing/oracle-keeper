# oracle-keeper 部署栈。
#
# 默认单盘：所有临时文件都写宿主机 /data/oracle-keeper 这一个目录
# （/data 现在只是系统盘上的普通目录）。以后若再加数据盘，挂载进来并在
# .env 的 ORACLE_KEEPER_DISK_ROOTS 里追加路径即可（多盘自动分摊写入）。
#
# 重要：不要给这个容器加 mem_limit / cpus 限制——
#   - 内存组件按宿主机总内存比例分配，容器限额会导致过量分配 → OOMKill；
#   - CPU 限额会压低保活效果。它需要的只是写挂载目录 + 出网下载，
#   因此以 root uid 运行但剥掉全部 capabilities。

services:
  oracle-keeper:
    # CI（.github/workflows/deploy.yml）推到 ghcr 并在 VM 上 pull 这个镜像，
    # 部署时会显式 export IMAGE_REPOSITORY 兜底；fork 后改这里的默认值或 .env 覆盖。
    image: ${IMAGE_REPOSITORY:-ghcr.io/ai1888888/oracle-keeper}:${IMAGE_TAG:-latest}
    build:
      context: ".."
      dockerfile: "oracle-keeper/Dockerfile"
      # 国内机器构建时在 .env 设 GOPROXY=https://goproxy.cn,direct
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    container_name: oracle-keeper
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # 让容器内 DB_HOST=host.docker.internal 解析到宿主机（访问同机 MySQL 用）
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      # 留空 SPEC = 随机间隔模式（默认，反指纹）：每轮结束后随机 48-72 分钟再跑下一轮。
      # 设了 SPEC（如 "0 4-8 * * *"）则走固定 cron，间隔配置被忽略。
      - ORACLE_KEEPER_SCHEDULE_SPEC=${ORACLE_KEEPER_SCHEDULE_SPEC:-}
      - ORACLE_KEEPER_SCHEDULE_INTERVAL_MIN=${ORACLE_KEEPER_SCHEDULE_INTERVAL_MIN:-48m}
      - ORACLE_KEEPER_SCHEDULE_INTERVAL_MAX=${ORACLE_KEEPER_SCHEDULE_INTERVAL_MAX:-72m}
      - ORACLE_KEEPER_SCHEDULE_JITTER_MINUTES=${ORACLE_KEEPER_SCHEDULE_JITTER_MINUTES:-2}
      - ORACLE_KEEPER_SCHEDULE_MAX_RUN_DURATION=${ORACLE_KEEPER_SCHEDULE_MAX_RUN_DURATION:-45m}
      - ORACLE_KEEPER_BUSY_CPU_PERCENT=${ORACLE_KEEPER_BUSY_CPU_PERCENT:-40}
      - ORACLE_KEEPER_BUSY_LOAD_FACTOR=${ORACLE_KEEPER_BUSY_LOAD_FACTOR:-0.8}
      - ORACLE_KEEPER_CPU_BURN_DURATION=${ORACLE_KEEPER_CPU_BURN_DURATION:-5m}
      - ORACLE_KEEPER_CPU_DUTY_CYCLE=${ORACLE_KEEPER_CPU_DUTY_CYCLE:-0.7}
      - ORACLE_KEEPER_MEM_ALLOC_PERCENT=${ORACLE_KEEPER_MEM_ALLOC_PERCENT:-30}
      - ORACLE_KEEPER_NET_TOTAL_MB=${ORACLE_KEEPER_NET_TOTAL_MB:-700}
      - ORACLE_KEEPER_NET_MAX_PER_HOST_MB=${ORACLE_KEEPER_NET_MAX_PER_HOST_MB:-250}
      - ORACLE_KEEPER_DISK_WRITE_MB=${ORACLE_KEEPER_DISK_WRITE_MB:-256}
      - ORACLE_KEEPER_DISK_RETAIN_FILES=${ORACLE_KEEPER_DISK_RETAIN_FILES:-true}
      - ORACLE_KEEPER_DISK_PURGE_PERCENT=${ORACLE_KEEPER_DISK_PURGE_PERCENT:-20}
      # ---- 小业务数据库模拟（DB_DRIVER 留空 = 关闭）----
      - ORACLE_KEEPER_DB_DRIVER=${ORACLE_KEEPER_DB_DRIVER:-}
      - ORACLE_KEEPER_DB_HOST=${ORACLE_KEEPER_DB_HOST:-host.docker.internal}
      - ORACLE_KEEPER_DB_PORT=${ORACLE_KEEPER_DB_PORT:-3306}
      - ORACLE_KEEPER_DB_USER=${ORACLE_KEEPER_DB_USER:-}
      - ORACLE_KEEPER_DB_PASSWORD=${ORACLE_KEEPER_DB_PASSWORD:-}
      - ORACLE_KEEPER_DB_DB_NAME=${ORACLE_KEEPER_DB_DB_NAME:-}
      - ORACLE_KEEPER_DB_TABLE=${ORACLE_KEEPER_DB_TABLE:-keeper_orders}
      - ORACLE_KEEPER_DB_MAX_ROWS=${ORACLE_KEEPER_DB_MAX_ROWS:-1000000}
      - ORACLE_KEEPER_LOG_LEVEL=${ORACLE_KEEPER_LOG_LEVEL:-info}
    volumes:
      # 临时文件根目录：所有文件都在这一个目录里，按模式轮末清理或保留至高水位
      - /data/oracle-keeper:/data/oracle-keeper
